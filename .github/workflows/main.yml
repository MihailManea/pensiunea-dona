name: Deploy Pensiunea Dona

on:
  push:
    branches:
      - main
  workflow_dispatch:
  
permissions:
    contents: read
    pages: write
    id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
   
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun 
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
          
      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        env:
          BASE_PATH: /pensiunea-dona/
        run: bun run build

      - name: Prepare static site
        run: |
          rm -rf _site
          mkdir _site
          cp -R .output/public/. _site/

          if [ -f "_site/_shell.html" ]; then
            cp "_site/_shell.html" "_site/index.html"
          fi

          if [ -f "_site/index.html" ]; then
            cp "_site/index.html" "_site/404.html"
          fi

          touch _site/.nojekyll

      - name: Verify GitHub Pages asset paths
        run: |
          bun -e '
            const html = await Bun.file("_site/index.html").text();
            const urls = [...html.matchAll(/(?:src|href)="([^"]+)"/g)]
              .map((match) => match[1])
              .filter((url) => url.includes("/assets/"));
            if (urls.length === 0) throw new Error("No application assets found in index.html");
            for (const url of urls) {
              if (!url.startsWith("/pensiunea-dona/assets/")) {
                throw new Error(`Incorrect GitHub Pages asset path: ${url}`);
              }
              const file = `_site/${url.slice("/pensiunea-dona/".length).split(/[?#]/)[0]}`;
              if (!(await Bun.file(file).exists())) throw new Error(`Missing asset: ${file}`);
            }
            console.log(`Verified ${urls.length} GitHub Pages asset paths`);
          '

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
      needs: build
      runs-on: ubuntu-latest
  
      environment:
        name: github-pages
        url: ${{ steps.deployment.outputs.page_url }}
    
      steps:
       - name: Deploy to Github Pages
         id: deployment
         uses: actions/deploy-pages@v4
